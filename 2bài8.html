<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vocabulary & Grammar Test - 45 Questions</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent:#2b6cb0;--correct:#28a745;--wrong:#dc3545}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0;background:var(--bg);color:#111}
    header{background:linear-gradient(90deg,#1f6fb8,#2b6cb0);color:white;padding:18px 24px}
    .container{max-width:980px;margin:18px auto;padding:18px}
    .card{background:var(--card);border-radius:10px;box-shadow:0 6px 20px rgba(20,20,40,0.06);padding:18px}
    h1{margin:0 0 6px;font-size:20px}
    p.lead{margin:6px 0 16px;color:#334155}
    .question{padding:12px;border-radius:8px;margin-bottom:10px;border:1px solid #eef2f7}
    .qnum{font-weight:600;margin-bottom:6px}
    .options{display:flex;gap:12px;flex-wrap:wrap}
    label.opt{flex:1;min-width:150px;background:#f8fafc;padding:10px;border-radius:8px;border:1px solid #e6eef8;cursor:pointer}
    input[type=radio]{margin-right:8px}
    .controls{display:flex;gap:10px;align-items:center;margin-top:14px}
    button{background:var(--accent);color:white;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
    button.secondary{background:#6b7280}
    .result{margin-top:14px;padding:12px;border-radius:8px}
    .correct{background:rgba(40,167,69,0.08);border:1px solid rgba(40,167,69,0.18);color:var(--correct)}
    .wrong{background:rgba(220,53,69,0.06);border:1px solid rgba(220,53,69,0.12);color:var(--wrong)}
    .small{font-size:13px;color:#475569}
    footer{max-width:980px;margin:20px auto;text-align:center;color:#64748b}
    @media (max-width:700px){.options{flex-direction:column}}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Vocabulary & Grammar - 45-question Test</h1>
      <div class="small">Điền chọn A, B, C hoặc D cho mỗi câu. Nhấn "Nộp bài" để chấm điểm và xem đáp án.</div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <form id="quizForm">
        <div id="questions"></div>

        <div class="controls">
          <button type="button" id="submitBtn">Nộp bài</button>
          <button type="button" id="resetBtn" class="secondary">Làm lại</button>
          <div id="score" style="margin-left:auto"></div>
        </div>
      </form>

      <div id="feedback" style="margin-top:12px"></div>
    </div>
  </main>

  <footer>
    <div class="small">Đề gốc: Bài trắc nghiệm 50 câu (Vocabulary & Grammar)</div>
  </footer>

  <script>
  // --- QUESTIONS DATA ---
    const questionsData = [
  {
    id: 1,
    q: "Năm 1911, Nguyễn Tất Thành ra đi tìm đường cứu nước từ",
    opts: {
      A: "bến cảng Nhà Rồng.",
      B: "biên giới phía Bắc.",
      C: "địa đầu Móng Cái.",
      D: "bến tàu Thuận An."
    },
    answer: "A"
  },
  {
    id: 2,
    q: "Năm 1920, Luận cương về các vấn đề dân tộc và thuộc địa của Lê-nin được đăng trên báo nào?",
    opts: {
      A: "Chuông Rè.",
      B: "Nhân Đạo.",
      C: "Nhành Lúa.",
      D: "Tiếng Dân."
    },
    answer: "B"
  },
  {
    id: 3,
    q: "Một trong những nội dung con đường cứu nước của Nguyễn Ái Quốc là",
    opts: {
      A: "cách mạng vô sản ở chính quốc trước.",
      B: "kháng chiến kết hợp kiến quốc.",
      C: "giải phóng dân tộc gắn với giải phóng giai cấp.",
      D: "xây dựng quân đội mạnh."
    },
    answer: "C"
  },
  {
    id: 4,
    q: "Tờ báo do Nguyễn Ái Quốc làm chủ nhiệm kiêm chủ bút là",
    opts: {
      A: "An Nam trẻ.",
      B: "Người Nhà quê.",
      C: "Người cùng khổ.",
      D: "Đại đoàn kết."
    },
    answer: "C"
  },
  {
    id: 5,
    q: "Nguyễn Ái Quốc triệu tập hội nghị hợp nhất các tổ chức cộng sản với cương vị",
    opts: {
      A: "cố vấn quân sự.",
      B: "lãnh đạo Quốc tế Cộng sản.",
      C: "lãnh đạo tối cao cách mạng.",
      D: "phái viên Quốc tế Cộng sản."
    },
    answer: "D"
  },
  {
    id: 6,
    q: "Tư tưởng cốt lõi của Cương lĩnh chính trị 2/1930 là",
    opts: {
      A: "độc lập dân tộc.",
      B: "độc lập, tự do.",
      C: "dân sinh, dân chủ.",
      D: "cơm áo, hòa bình."
    },
    answer: "B"
  },
  {
    id: 7,
    q: "Vai trò của Nguyễn Ái Quốc tại Hội nghị Trung ương 8 (5-1941) là",
    opts: {
      A: "triệu tập và chủ trì.",
      B: "tham dự.",
      C: "quan sát viên.",
      D: "chi phối hội nghị."
    },
    answer: "A"
  },
  {
    id: 8,
    q: "Nội dung được đưa ra tại Hội nghị Trung ương 8 (1941) là",
    opts: {
      A: "thành lập chính phủ lâm thời.",
      B: "thành lập Việt Minh.",
      C: "lập đội du kích Ba Tơ.",
      D: "lập khu giải phóng."
    },
    answer: "B"
  },
  {
    id: 9,
    q: "Năm 1941, căn cứ địa đầu tiên được chọn là",
    opts: {
      A: "Cao Bằng.",
      B: "Lạng Sơn.",
      C: "Phú Thọ.",
      D: "Yên Bái."
    },
    answer: "A"
  },
  {
    id: 10,
    q: "Hiệp định đầu tiên Hồ Chí Minh ký với Pháp năm 1946 là",
    opts: {
      A: "Tạm ước.",
      B: "Hiệp định Sơ bộ.",
      C: "Pa-ri.",
      D: "Giơ-ne-vơ."
    },
    answer: "B"
  },
  {
    id: 11,
    q: "Tháng 12-1946, Hồ Chí Minh đã",
    opts: {
      A: "ra lời kêu gọi toàn quốc kháng chiến.",
      B: "công bố chỉ thị toàn dân kháng chiến.",
      C: "đề ra kháng chiến đơn độc.",
      D: "đi Pháp hòa hoãn."
    },
    answer: "A"
  },
  {
    id: 12,
    q: "Bài hát “Bác đang cùng chúng cháu hành quân” nhắc đến chiến dịch",
    opts: {
      A: "Việt Bắc 1947.",
      B: "Biên giới 1950.",
      C: "Thượng Lào 1953.",
      D: "Hòa Bình 1952."
    },
    answer: "B"
  },
  {
    id: 13,
    q: "Văn kiện Hồ Chí Minh trực tiếp viết và trình bày là",
    opts: {
      A: "Luận cương chính trị.",
      B: "Tuyên ngôn độc lập.",
      C: "Quân lệnh số 1.",
      D: "Hiệp định Giơ-ne-vơ."
    },
    answer: "B"
  },
  {
    id: 14,
    q: "Tổ chức do Nguyễn Ái Quốc thành lập ở nước ngoài là",
    opts: {
      A: "Hội Việt Nam Cách mạng thanh niên.",
      B: "Đông Dương Cộng sản liên đoàn.",
      C: "Việt Minh.",
      D: "Đội Việt Nam Tuyên truyền GPQ."
    },
    answer: "A"
  },
  {
    id: 15,
    q: "Một công lao lớn của Nguyễn Ái Quốc là",
    opts: {
      A: "tìm ra con đường cứu nước.",
      B: "gia nhập Quốc tế III.",
      C: "lập Đảng Cộng sản Pháp.",
      D: "dự tang lễ Lênin."
    },
    answer: "A"
  },
  {
    id: 16,
    q: "Nguyên nhân thúc đẩy phong trào 1925 trở đi là",
    opts: {
      A: "hoạt động của Nguyễn Ái Quốc.",
      B: "Pháp đàn áp.",
      C: "khai thác thuộc địa lần hai.",
      D: "khủng hoảng kinh tế."
    },
    answer: "A"
  },
  {
    id: 17,
    q: "Lý luận giải phóng dân tộc đầu tiên trình bày trong",
    opts: {
      A: "Chỉ thị toàn dân kháng chiến.",
      B: "Bản án chế độ thực dân Pháp.",
      C: "Đường kách mệnh.",
      D: "Cương lĩnh chính trị."
    },
    answer: "C"
  },
  {
    id: 18,
    q: "Nội dung không phải đóng góp năm 1930 là",
    opts: {
      A: "triệu tập hội nghị.",
      B: "thống nhất tổ chức.",
      C: "soạn Cương lĩnh.",
      D: "là Tổng Bí thư đầu tiên."
    },
    answer: "D"
  },
  {
    id: 19,
    q: "Sự kiện đánh dấu tìm ra con đường cứu nước là",
    opts: {
      A: "gửi yêu sách 1919.",
      B: "đọc luận cương Lê-nin 1920.",
      C: "gia nhập Quốc tế CS.",
      D: "lập Hội thanh niên."
    },
    answer: "B"
  },
  {
    id: 20,
    q: "Nguyễn Ái Quốc gia nhập Quốc tế III vì",
    opts: {
      A: "bênh vực thuộc địa.",
      B: "giúp chống Pháp.",
      C: "đề ra đường lối.",
      D: "viện trợ vật chất."
    },
    answer: "A"
  },
  {
    id: 22,
    q: "Mục đích chuyến thăm các nước XHCN là",
    opts: {
      A: "tranh thủ viện trợ.",
      B: "gia nhập khối quân sự.",
      C: "lập liên minh chống Mỹ.",
      D: "xin công nghệ."
    },
    answer: "A"
  },
  {
    id: 24,
    q: "Nội dung rút ra 1911-1941 là",
    opts: {
      A: "kinh tế thị trường.",
      B: "tư bản chèn ép Nga.",
      C: "giải phóng ở chính quốc.",
      D: "bản chất tàn bạo thực dân."
    },
    answer: "D"
  },
  {
    id: 25,
    q: "Vai trò Hồ Chí Minh 1945-1969 là",
    opts: {
      A: "lãnh tụ tối cao.",
      B: "Bí thư thứ nhất.",
      C: "Tổng Bí thư đầu tiên.",
      D: "soạn Hiến pháp."
    },
    answer: "A"
  },
  {
    id: 26,
    q: "Nội dung không phải cống hiến 1911-1930 là",
    opts: {
      A: "tìm đường cứu nước.",
      B: "thành lập Đảng.",
      C: "truyền bá Mác.",
      D: "đề ra kháng chiến."
    },
    answer: "D"
  },
  {
    id: 27,
    q: "Điểm mới trong con đường cứu nước là",
    opts: {
      A: "gửi yêu sách.",
      B: "tiếp thu văn minh Tây.",
      C: "đi phương Tây khảo sát.",
      D: "nhờ đào tạo lực lượng."
    },
    answer: "C"
  },
  {
    id: 29,
    q: "Ý nghĩa sự kiện 1920 là",
    opts: {
      A: "tìm ra con đường cứu nước.",
      B: "bước ngoặt lịch sử.",
      C: "liên hệ quốc tế.",
      D: "chuyển biến tư tưởng."
    },
    answer: "D"
  }
];

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }
shuffleArray(questionsData);

const container = document.getElementById('questions');

questionsData.forEach((item, index) => {
  const qNumber = index + 1;

  const div = document.createElement('div');
  div.className = 'question';
  div.id = 'q' + qNumber;

  div.innerHTML = `
    <div class="qnum">Câu ${qNumber}:</div>
    <div class="qtext">${item.q}</div>
    <div class="options">
      ${Object.entries(item.opts).map(([key, val]) => `
        <label class="opt">
          <input type="radio" name="q${qNumber}" value="${key}">
          <strong>${key}.</strong> ${val}
        </label>
      `).join('')}
    </div>
  `;

  container.appendChild(div);
});


  // grading logic
  const submitBtn = document.getElementById('submitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const scoreDiv = document.getElementById('score');
  const feedbackDiv = document.getElementById('feedback');

  submitBtn.addEventListener('click', ()=>{
  let correctCount = 0;
  let total = questionsData.length;

  for(let i=0;i<total;i++){
    const qNumber = i + 1;
    const selected = document.querySelector(`input[name="q${qNumber}"]:checked`);
    const qDiv = document.getElementById('q'+qNumber);

    qDiv.classList.remove('correct','wrong');
    const old = qDiv.querySelector('.note'); if(old) old.remove();

    const note = document.createElement('div');
    note.className = 'note small';

    if(!selected){
      note.textContent = '(Chưa trả lời)';
      qDiv.appendChild(note);
      continue;
    }

    if(selected.value === questionsData[i].answer){
      correctCount++;
      qDiv.classList.add('correct');
      note.textContent = `Đúng — đáp án: ${questionsData[i].answer}`;
    } else {
      qDiv.classList.add('wrong');
      note.textContent = `Sai — đáp án đúng: ${questionsData[i].answer}`;
    }

    qDiv.appendChild(note);
  }

  scoreDiv.innerHTML = `<strong>Kết quả: ${correctCount}/${total}</strong>`;
  submitBtn.disabled = true;
});

  resetBtn.addEventListener('click', ()=>{
    document.getElementById('quizForm').reset();
    // clear highlights/notes
    for(let i=1;i<=questionsData.length;i++){
      const qDiv = document.getElementById('q'+i);
      qDiv.classList.remove('correct','wrong');
      const note = qDiv.querySelector('.note'); if(note) note.remove();
      const un = qDiv.querySelector('.small'); if(un) un.remove();
    }
    scoreDiv.innerHTML='';
    feedbackDiv.innerHTML='';
    submitBtn.disabled = false;
  });
  </script>
</body>
</html>
